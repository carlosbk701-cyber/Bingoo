<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080e1a;
            --card-bg: #111c30;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --border-color: #1e3a8a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .nav-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-title {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 2px;
        }
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background: var(--accent-gradient);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
        }
        .cartela-item {
            background: #1e293b;
            border: 1px solid #334155;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .cartela-item.selected {
            background: var(--success-color);
            border-color: #fff;
            color: #fff;
            font-weight: bold;
        }
        .game-board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .cell {
            aspect-ratio: 1;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .cell span {
            font-size: 8px;
            color: var(--text-muted);
        }
        .cell.marked {
            background: var(--success-color);
            color: #fff;
            border-color: #86efac;
        }
        .cell.free {
            background: #475569;
            font-size: 10px;
        }
        .header-cell {
            background: #0284c7 !important;
            color: #fff;
            font-size: 12px;
            cursor: default;
        }
        .called-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #020617;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .big-called {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Top Navigation -->
        <div class="top-nav">
            <button class="nav-btn" onclick="goHome()">← Back</button>
            <span style="font-weight: bold; font-size: 15px;">Carl Bingo 🎱</span>
        </div>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">Medeb</div>
                <div class="stat-value">10 Br</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Players</div>
                <div class="stat-value" id="player-count">23</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Balance</div>
                <div class="stat-value" id="balance">100 Br</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Derash</div>
                <div class="stat-value" id="derash-val">207 Br</div>
            </div>
        </div>

        <!-- Select Cartela View -->
        <div id="select-view" class="section-card">
            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                <span style="font-weight: bold; color: var(--accent-color);">Select Cartela (up to 5)</span>
                <span id="timer-box" style="color: #fbbf24;">Game starting in ⏱ 15s</span>
            </div>
            <div class="cartela-grid" id="cartela-grid"></div>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Active Game View -->
        <div id="game-view" class="section-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="big-called" id="current-called-box">B-9</div>
                <div style="text-align: right;">
                    <div style="font-size: 11px; color: var(--text-muted);" id="called-count-text">Called: 1/75</div>
                    <div style="font-size: 13px; font-weight: bold; color: var(--accent-color);">CARD #<span id="active-card-num">18</span></div>
                </div>
            </div>

            <!-- Card Grid -->
            <div class="game-board-grid" id="game-board"></div>

            <button class="btn" id="bingo-btn" style="background: #22c55e; color: #fff; display: none;" onclick="declareBingo()">🎉 BINGOO አውጅ!</button>
        </div>

        <!-- Win / Result View -->
        <div id="win-view" class="section-card" style="display: none; text-align: center;">
            <h2 style="color: var(--accent-color); font-size: 22px;">🎊 BINGO! 🎊</h2>
            <p id="winner-text" style="color: var(--text-muted); font-size: 13px;"></p>
            <div style="background: #020617; padding: 12px; border-radius: 8px;">
                <span id="win-amount" style="color: #fbbf24; font-size: 18px; font-weight: bold;"></span>
            </div>
            <button class="btn" onclick="goHome()">Next Game</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;
        let selectedCartela = 18;
        let calledNumbers = [];
        let playerCardNumbers = [];
        let gameInterval = null;
        let currentPrize = 207;

        function initCartelas() {
            const grid = document.getElementById('cartela-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 70; i++) {
                let item = document.createElement('div');
                item.className = 'cartela-item' + (i === selectedCartela ? ' selected' : '');
                item.innerText = i;
                item.onclick = () => {
                    selectedCartela = i;
                    document.getElementById('active-card-num').innerText = i;
                    initCartelas();
                };
                grid.appendChild(item);
            }
        }
        initCartelas();

        function getLetter(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        function startGame() {
            if (balance < 10) {
                alert('ቀሪ ሒሳብዎ በቂ አይደለም!');
                return;
            }
            balance -= 10;
            let players = 23;
            currentPrize = 207; // 23 * 10 * 0.9 (90% prize pool)
            document.getElementById('player-count').innerText = players;
            document.getElementById('derash-val').innerText = currentPrize + ' Br';
            document.getElementById('balance').innerText = balance + ' Br';

            document.getElementById('select-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('bingo-btn').style.display = 'none';

            calledNumbers = [];
            generateCardBoard();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(callNext, 3000);
        }

        function generateCardBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = `
                <div class="cell header-cell">B</div>
                <div class="cell header-cell">I</div>
                <div class="cell header-cell">N</div>
                <div class="cell header-cell">G</div>
                <div class="cell header-cell">O</div>
            `;
            playerCardNumbers = [];
            for (let col = 0; col < 5; col++) {
                let min = col * 15 + 1, max = min + 15;
                let colNums = [];
                while(colNums.length < 5) {
                    let r = Math.floor(Math.random() * (max - min)) + min;
                    if(!colNums.includes(r)) colNums.push(r);
                }
                for(let row = 0; row < 5; row++) playerCardNumbers.push(colNums[row]);
            }
            playerCardNumbers[12] = 'FREE';

            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                let val = playerCardNumbers[i];
                if(val === 'FREE') {
                    cell.className += ' free marked';
                    cell.innerText = 'FREE';
                } else {
                    cell.innerHTML = `<span>${getLetter(val)}</span>${val}`;
                    cell.onclick = () => {
                        if(calledNumbers.includes(val)) {
                            cell.classList.toggle('marked');
                            checkWinningCondition();
                        } else {
                            tg.HapticFeedback.notificationOccurred('error');
                        }
                    };
                }
                board.appendChild(cell);
            }
        }

        function callNext() {
            let available = [];
            for(let i=1; i<=75; i++) if(!calledNumbers.includes(i)) available.push(i);
            if(available.length === 0) { clearInterval(gameInterval); return; }
            
            let nextNum = available[Math.floor(Math.random() * available.length)];
            calledNumbers.push(nextNum);

            let lettr = getLetter(nextNum);
            document.getElementById('current-called-box').innerText = `${lettr}-${nextNum}`;
            document.getElementById('called-count-text').innerText = `Called: ${calledNumbers.length}/75`;
            tg.HapticFeedback.impactOccurred('light');
        }

        function checkWinningCondition() {
            const cells = document.querySelectorAll('#game-board .cell:not(.header-cell)');
            let gridValues = [];
            cells.forEach(c => {
                gridValues.push(c.classList.contains('marked'));
            });

            let hasWon = false;

            // 1. Horizontal Check (አግድም መስመር - 5 ረድፎች)
            for (let r = 0; r < 5; r++) {
                if (gridValues[r*5] && gridValues[r*5+1] && gridValues[r*5+2] && gridValues[r*5+3] && gridValues[r*5+4]) {
                    hasWon = true;
                }
            }

            // 2. Vertical Check (ቁመት መስመር - 5 አምዶች)
            for (let c = 0; c < 5; c++) {
                if (gridValues[c] && gridValues[c+5] && gridValues[c+10] && gridValues[c+15] && gridValues[c+20]) {
                    hasWon = true;
                }
            }

            // 3. Diagonal Check (ሰያፍ መስመር - 2 ሰያፎች)
            if (gridValues[0] && gridValues[6] && gridValues[12] && gridValues[18] && gridValues[24]) {
                hasWon = true;
            }
            if (gridValues[4] && gridValues[8] && gridValues[12] && gridValues[16] && gridValues[20]) {
                hasWon = true;
            }

            if (hasWon) {
                document.getElementById('bingo-btn').style.display = 'block';
            } else {
                document.getElementById('bingo-btn').style.display = 'none';
            }
        }

        function declareBingo() {
            clearInterval(gameInterval);
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('win-view').style.display = 'flex';
            document.getElementById('winner-text').innerText = `Card #${selectedCartela} won this game.`;
            document.getElementById('win-amount').innerText = `${currentPrize} Br`;
            balance += currentPrize;
            document.getElementById('balance').innerText = balance + ' Br';
            tg.HapticFeedback.notificationOccurred('success');
        }

        function goHome() {
            if (gameInterval) clearInterval(gameInterval);
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('win-view').style.display = 'none';
            document.getElementById('select-view').style.display = 'flex';
        }
    </script>
</body>
</html>
