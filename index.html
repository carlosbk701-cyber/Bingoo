<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingoo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
        }
        .balance-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Bingoo Cash Games</h1>
        <p>እንኳን ወደ Bingoo በደህና መጡ!</p>
        <div class="balance-card">
            <h3>ቀሪ ሂሳብ (Balance)</h3>
            <p style="font-size: 24px; font-weight: bold; color: #4ade80;">0.00 ETB</p>
        </div>
        <button class="btn" onclick="alert('ጨዋታው በቅርቡ ይጀመራል!')">ጨዋታ ጀምር 🎲</button>
    </div>
</body>
</html>
